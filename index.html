<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PanggilAja</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f1f4f9;
  color: #333;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #2b7cff, #00c6ff);
  color: white;
  padding: 40px 20px;
  text-align: center;
  animation: fadeDown 1s ease;
}

header h1 {
  font-size: 28px;
}

header p {
  margin-top: 10px;
  opacity: 0.9;
}

/* CARD */
.card {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  animation: fadeUp 1s ease;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 14px 25px;
  background: #28a745;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
}

/* Ripple effect */
.btn:after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,0.5);
  width: 100px;
  height: 100px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  border-radius: 50%;
  opacity: 0;
  transition: 0.6s;
}

.btn:active:after {
  transform: translate(-50%, -50%) scale(2);
  opacity: 1;
}

/* SERVICES */
.services {
  display: flex;
  justify-content: space-around;
  margin-top: 15px;
  text-align: center;
}

.services div {
  font-size: 14px;
}

/* FORM */
iframe {
  width: 100%;
  height: 700px;
  border: none;
  border-radius: 12px;
}

/* FLOATING WA BUTTON */
.wa {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 15px 18px;
  border-radius: 50%;
  font-size: 20px;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  animation: bounce 2s infinite;
}

/* ANIMATIONS */
@keyframes fadeUp {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes fadeDown {
  from {opacity: 0; transform: translateY(-20px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-8px);}
}

</style>
</head>

<body>

<header>
  <h1>PanggilAja</h1>
  <p>Satu Panggilan, Semua Beres! 📲</p>
</header>

<div class="card">
  <h2>🧾 Layanan Kami</h2>
  <div class="services">
    <div>📚 Kursus</div>
    <div>🧹 Cleaning</div>
    <div>🚗 Antar Jemput</div>
  </div>
<div class="card" id="form">
  <h2>📝 Isi Form Pemesanan</h2>
  <!-- GANTI LINK GOOGLE FORM -->
  <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfHQJDwIFz75NqH_h_1FOMColltwoN6j0RC_S6n6YflJE3uiQ/viewform" target="_blank">Isi Form Sekarang
</a>
</div>

<div class="card" id="form">
  <h2>💬 Respon Cepat</h2>
  <!-- GANTI LINK GOOGLE FORM -->
  <a class="btn" href="https://t.me/jasa_pro" target="_blank">Chat Telegram
</a>
</div>

</body>
</html>
