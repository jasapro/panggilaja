<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PanggilAja</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f1f4f9;
  color: #333;
}

/* HERO */
.hero {
  position: relative;
  text-align: center;
  color: white;
}

.hero img {
  width: 100%;
  height: 30vh; /* RESPONSIVE */
  object-fit: cover;
}

/* Overlay gelap */
.hero::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  top: 0;
  left: 0;
}

/* Teks di tengah */
.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}

.overlay h1 {
  font-size: 28px;
}

.overlay p {
  font-size: 14px;
}

/* CARD */
.card {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  animation: fadeUp 1s ease;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 14px 25px;
  background: #28a745;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 15px;
}

/* SERVICES */
.services {
  display: flex;
  justify-content: space-around;
  margin-top: 15px;
  text-align: center;
}

/* TESTIMONI */
.testimoni {
  font-size: 14px;
  margin-top: 10px;
  padding: 10px;
  background: #f9fafc;
  border-radius: 10px;
}

/* TELEGRAM FLOAT */
.tg {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #0088cc;
  color: white;
  padding: 15px 18px;
  border-radius: 50%;
  font-size: 20px;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  animation: bounce 2s infinite;
}

/* ANIMASI */
@keyframes fadeUp {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-8px);}
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <img src="panggilaja.png" alt="Jasa Panggilan">
  <div class="overlay"></div>
</div>

<!-- LAYANAN -->
<div class="card">
  <h2>🧾 Layanan Kami</h2>
  <div class="services">
    <div>📚 Kursus</div>
    <div>🧹 Cleaning</div>
    <div>🚗 Antar Jemput</div>
  </div>
</div>

<!-- FORM -->
<div class="card">
  <h2>📝 Pesan Sekarang</h2>
  <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfHQJDwIFz75NqH_h_1FOMColltwoN6j0RC_S6n6YflJE3uiQ/viewform" target="_blank">
    Isi Form Sekarang
  </a>
</div>

<!-- TELEGRAM -->
<div class="card">
  <h2>💬 Respon Cepat</h2>
  <a class="btn" href="https://t.me/jasa_pro" target="_blank">
    Chat via Telegram
  </a>
</div>

<!-- TESTIMONI -->
<div class="card">
  <h2>⭐ Testimoni Pelanggan</h2>
  <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdqWlzFF6-OILM9Eq1yAA3H6ohVApb69FoUyQueuuDhXFt46g/viewform" target="_blank">
    Kirim Testimoni
  </a>
</div>
</body>
</html>
